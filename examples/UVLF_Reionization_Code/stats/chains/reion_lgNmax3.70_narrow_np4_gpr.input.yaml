theory:
  likelihoods.GPRTheory:
    python_path: ../../code/likes/
    gprt: true
    interpolator: true
    keys:
    - lsum
    - ldiff
    - l2
    - l3
likelihood:
  likelihoods.EmulLike:
    python_path: ../../code/likes/
params:
  lsum:
    ref:
      min: -0.4918131
      max: -0.4718131
    prior:
      min: -1.0
      max: 0.0
    proposal: 0.005
    latex: \ell_{\varepsilon,0} + \dfrac{\ell_{\varepsilon,\mathrm{jump}}}{2}
  ldiff:
    ref:
      min: -0.8913186
      max: -0.8713185999999999
    prior:
      min: -1.0
      max: -0.75
    proposal: 0.005
    latex: \ell_{\varepsilon,0} - \dfrac{\ell_{\varepsilon,\mathrm{jump}}}{2}
  l2:
    ref:
      min: 10.72925
      max: 10.74925
    prior:
      min: 9.5
      max: 12.5
    proposal: 0.005
    latex: z_\ast
  l3:
    ref:
      min: 1.107791
      max: 1.127791
    prior:
      min: 0.25
      max: 3.0
    proposal: 0.005
    latex: \Delta z_\ast
sampler:
  mcmc:
    learn_proposal: true
    Rminus1_single_split: 4
    measure_speeds: true
    max_samples: 1000000
    max_tries: 10000
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.05
    Rminus1_cl_level: 0.95
    burn_in: 0
output: reion_lgNmax3.70_narrow_np4_gpr
